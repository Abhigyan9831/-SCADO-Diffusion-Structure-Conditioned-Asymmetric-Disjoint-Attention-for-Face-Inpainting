model:
  image_size: 512
  in_channels: 3
  out_channels: 3
  num_landmarks: 7

unet:
  base_channels: 64
  channel_multipliers: [1, 2, 4, 8]
  num_res_blocks: 2
  attention_resolutions: [16, 32]   # apply attention at these spatial resolutions
  dropout: 0.1
  use_gradient_checkpointing: False

scado:
  embed_dim: 256
  num_heads: 8
  num_landmarks: 7
  landmark_sigma: 5.0              # Gaussian blob sigma for heatmaps
  symmetry_weight: 0.1
  graph_hidden_dim: 128

diffusion:
  num_timesteps: 1000
  noise_schedule: cosine           # linear | cosine
  beta_start: 0.0001
  beta_end: 0.02
  sampling_steps: 10               # DDIM steps for fast inference

discriminator:
  base_channels: 64
  num_layers: 3
  use_spectral_norm: true
